<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#012456"><meta name="mobile-web-app-capable" content="yes">
<title>HRAI Mobile</title>
<style>
:root{--bg:#011a3d;--bg2:#02306e;--panel:rgba(255,255,255,.06);--panel2:rgba(255,255,255,.11);--line:rgba(255,255,255,.13);--fg:#eaf0fc;--dim:#9db0d3;--acc:#4da3ff;--accfg:#04122b;--plan:#f5c542;--build:#4ade80;--err:#ff8a8a;--code:#00122c;--ub:#1f6fe0;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root{--bg:#f3f6fc;--bg2:#e2ebfa;--panel:#fff;--panel2:#eaf0fb;--line:#d3deef;--fg:#0f1b33;--dim:#5a6b8c;--acc:#1f6fe0;--accfg:#fff;--plan:#b7791f;--build:#15803d;--err:#c53030;--code:#f1f5fc;color-scheme:light}}
*{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg)}
body{display:flex;flex-direction:column;background:linear-gradient(180deg,var(--bg2),var(--bg) 55%);font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
header{display:flex;align-items:center;gap:8px;padding:10px 12px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logo{width:34px;height:34px;flex:none;border-radius:10px;background:linear-gradient(135deg,#4da3ff,#1f6fe0);display:grid;place-items:center;font-weight:800;color:#fff;font-size:13px}
.ttl{min-width:0}.ttl b{display:block;font-size:15px;line-height:1.15}
.ttl span{display:block;font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--dim)}
.seg button.on{background:var(--panel2);color:var(--fg)}
#mode[data-m=PLAN] .on{color:var(--plan)}#mode[data-m=BUILD] .on{color:var(--build)}
.ib{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 11px;font-size:12.5px}
#log{flex:1;overflow-y:auto;padding:8px 14px 16px;display:flex;flex-direction:column;gap:14px}
.u{align-self:flex-end;max-width:85%;background:var(--ub);color:#fff;padding:9px 14px;border-radius:18px 18px 4px 18px;white-space:pre-wrap;word-break:break-word}
.a{white-space:pre-wrap;word-break:break-word}
code{font:.88em ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.a code{background:var(--panel2);padding:1px 6px;border-radius:6px}
pre{position:relative;margin:8px 0;padding:12px;background:var(--code);border:1px solid var(--line);border-radius:12px;overflow-x:auto;white-space:pre;font-size:12.5px;line-height:1.5}
.a pre code{background:none;padding:0}
.cp{position:absolute;right:6px;top:6px;font-size:11px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:2px 8px}
details{align-self:flex-start;max-width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 12px;font-size:12.5px;color:var(--dim)}
details[open]{width:100%}summary{cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}
.th{color:var(--dim);font-size:12.5px;border-left:2px solid var(--line);padding-left:10px;white-space:pre-wrap}.th:empty{display:none}
.er{background:color-mix(in srgb,var(--err) 12%,transparent);border:1px solid color-mix(in srgb,var(--err) 40%,transparent);color:var(--err);padding:8px 12px;border-radius:12px;font-size:13px;word-break:break-word}
.sys{color:var(--dim);font-size:13px}
.hero{margin:auto;text-align:center;padding:24px 6px}
.hero .logo{width:56px;height:56px;border-radius:16px;font-size:20px;margin:0 auto}
.hero h2{font-size:21px;margin:16px 0 6px}.hero p{color:var(--dim);margin:0 0 18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chips button{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px}
footer{padding:8px 12px 12px}
.composer{display:flex;align-items:flex-end;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:6px 6px 6px 16px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.composer:focus-within{border-color:var(--acc)}
textarea{flex:1;min-height:38px;max-height:30vh;resize:none;background:none;border:0;outline:0;padding:8px 0;font-size:16px;line-height:1.4}
#go{width:38px;height:38px;flex:none;border-radius:50%;border:0;background:var(--acc);color:var(--accfg);font-size:18px;font-weight:700}
dialog{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:520px;margin:auto auto 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
dialog::backdrop{background:rgba(0,10,30,.55);backdrop-filter:blur(3px)}
label{display:block;margin:14px 0 6px;color:var(--dim);font-size:12.5px}
dialog input[type=text],dialog input[type=password],dialog select{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px}
.row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:600}
#ok{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.si{display:flex;align-items:center;gap:8px;margin-top:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.si.cur{border-color:var(--acc)}
.st{flex:1;min-width:0;cursor:pointer}.st b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.st span{font-size:12px;color:var(--dim)}
.pb{right:66px}
.pvf{margin-top:6px;font-size:12.5px;padding:6px 12px}
#dp{width:100%;max-width:none;height:100%;max-height:none;margin:0;padding:0;border:0;border-radius:0;flex-direction:column;overflow:hidden}
#dp[open]{display:flex}
.ph{display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
.ph b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pf{flex:1;border:0;background:#fff;width:100%}
.composer{padding:6px}
textarea{padding:8px 0 8px 4px}
#at{width:38px;height:38px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--panel2);font-size:20px;line-height:1}
.att{gap:8px;overflow-x:auto;padding:0 4px 8px}
.ch{flex:none;display:flex;align-items:center;gap:6px;max-width:60vw;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px 8px;font-size:12.5px}
.ch img{width:36px;height:36px;object-fit:cover;border-radius:8px}
.ch span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch button{border:0;background:none;color:var(--dim);font-size:14px}
.u img{display:block;max-width:100%;max-height:200px;border-radius:10px;margin-bottom:6px}
.u .sys{color:rgba(255,255,255,.75);margin-bottom:4px}
#na{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
#ml{max-height:34vh;overflow-y:auto;margin-top:6px}
#mq{margin-top:8px}
.mi{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 4px;font-size:13px;word-break:break-all}
.mi.on{color:var(--acc);font-weight:600}
.tk{display:flex;align-items:flex-start;gap:10px;color:var(--dim);font-size:13px}
.tk .logo{width:28px;height:28px;border-radius:9px;font-size:10px;animation:pulse 1.5s ease-in-out infinite}
.tl{min-width:0;flex:1}.tr{display:flex;align-items:center;gap:4px;height:28px}.tr b{font-weight:600;color:var(--fg)}
.dots i{display:inline-block;width:5px;height:5px;margin-left:3px;border-radius:50%;background:var(--dim);animation:bl 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
.tt{white-space:pre-wrap;word-break:break-word;font-size:12.5px;border-left:2px solid var(--line);padding-left:10px;margin:2px 0 0}
.tt:empty{display:none}.tt:not(:empty)::after{content:"▍";margin-left:2px;animation:bl 1s steps(1) infinite}
.thw{align-self:flex-start;max-width:100%}.thd summary{color:var(--dim)}
.thx{white-space:pre-wrap;word-break:break-word;margin-top:6px;max-height:40vh;overflow:auto}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(77,163,255,.55)}50%{transform:scale(1.07);box-shadow:0 0 0 8px rgba(77,163,255,0)}}
@keyframes bl{0%,100%{opacity:.25}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.tk .logo,.dots i,.tt::after{animation:none}}
.t-kw{color:#c792ea}.t-st{color:#a5e075}.t-nm{color:#f78c6c}.t-fn{color:#82aaff}.t-ty{color:#ffcb6b}.t-cn{color:#ff6e6e}.t-bi{color:#7fdbca}.t-vr{color:#f07178}.t-cm{color:#7f8fb0;font-style:italic}.t-tg{color:#f07178}.t-at{color:#f9b572}.t-jk{color:#89ddff}
@media(prefers-color-scheme:light){.t-kw{color:#7c3aed}.t-st{color:#15803d}.t-nm{color:#c2410c}.t-fn{color:#1d4ed8}.t-ty{color:#a16207}.t-cn{color:#dc2626}.t-bi{color:#0e7490}.t-vr{color:#be123c}.t-cm{color:#64748b}.t-tg{color:#be123c}.t-at{color:#b45309}.t-jk{color:#0369a1}}
.bn{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:center}
.bn svg{width:180px;height:72px;fill:var(--acc);shape-rendering:crispEdges}
.bn rect{opacity:0;animation:fi .4s ease forwards;animation-delay:calc(var(--i)*45ms)}
.bt{text-align:left;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;color:var(--dim)}.bt b{color:var(--fg)}
.bi{margin:14px 0 4px;color:var(--dim);font:12.5px ui-monospace,Menlo,Consolas,monospace}.bi b{color:var(--fg);font-weight:600}
.thx.ty::after{content:"▍";margin-left:2px;animation:bl 1s steps(1) infinite}
@keyframes fi{to{opacity:1}}
@media(prefers-reduced-motion:reduce){.bn rect{animation:none;opacity:1}}

[data-theme=terminal] .composer,[data-theme=powershell] .composer,[data-theme=amber] .composer{box-shadow:none}
:root:not([data-theme=hrai]) .logo{background:var(--acc);color:var(--accfg)}
[data-theme=terang] .t-kw{color:#7c3aed}[data-theme=terang] .t-st{color:#15803d}[data-theme=terang] .t-nm{color:#c2410c}[data-theme=terang] .t-fn{color:#1d4ed8}[data-theme=terang] .t-ty{color:#a16207}[data-theme=terang] .t-cn{color:#dc2626}[data-theme=terang] .t-bi{color:#0e7490}[data-theme=terang] .t-vr,[data-theme=terang] .t-tg{color:#be123c}[data-theme=terang] .t-cm{color:#64748b}[data-theme=terang] .t-at{color:#b45309}[data-theme=terang] .t-jk{color:#0369a1}
.ac{align-self:stretch;border:1px solid var(--line);background:var(--panel);border-radius:12px;overflow:hidden;font-size:13px}
.ah{display:flex;align-items:center;gap:8px;padding:8px 12px}
.ac.ok .ah,.ac.bad .ah{cursor:pointer}
.av{font-weight:600}.ap{flex:1;min-width:0;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.am{color:var(--dim);font-size:12px;white-space:nowrap}
.ab{margin:0;border:0;border-top:1px solid var(--line);border-radius:0;max-height:15em;overflow:auto}
.ac.ok .ab,.ac.bad .ab{display:none}.ac.ok.open .ab,.ac.bad.open .ab{display:block}
.ac.bad .av{color:var(--err)}
.sp{width:18px;height:18px;flex:none;stroke:var(--acc);stroke-width:2;stroke-linecap:round}
.tk .sp{width:22px;height:22px;margin-top:3px}
.sp g{transform-box:fill-box;transform-origin:center;animation:spin 3.2s linear infinite}

async function sse(r,cb){const rd=r.body.getReader(),dc=new TextDecoder();let b="";for(;;){const{done,value}=await rd.read();if(done)break;LT=Date.now();b+=dc.decode(value,{stream:true});const L=b.split("\n");b=L.pop();for(const l of L)if(l.startsWith("data:")){const s=l.slice(5).trim();if(s&&s!=="[DONE]")try{cb(JSON.parse(s))}catch{}}}}
