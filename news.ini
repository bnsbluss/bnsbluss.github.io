!Selamat datang di Kota Mati! Bertahan hidup, kumpulkan senjata, dan capai skor tertinggi.
Baru: Mode baru BattleGrounds, Siap antara kalian yang akan bertahan.
Baru: PvP 5 lawan 5 dengan tim Merah dan Biru. Tahan TAB untuk melihat papan skor.
Lari terlalu lama bikin LELAH. Atur napasmu sebelum dikejar gerombolan.
Barang jatuhan zombi hilang dalam 15 detik. Cepat ambil sebelum berkedip!
Senjata sudah diseimbangkan: shotgun paling kuat dari dekat, AWP tembus 3 zombi.
Map Goa Gelap selalu gelap. Andalkan senter dan suara langkah.
Hujan dan petir menunggu di Barak Tentara.
Tembak kepala untuk damage 2,5 kali lipat.
Main bareng teman: buka tab LOBBY, buat room, lalu bagikan kode undangannya.
